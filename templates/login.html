
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Notes Organizer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <div class="logo">📝</div>

        <h1>Smart Notes Organizer</h1>

        <h2>Welcome Back!</h2>

        <p>Login to your account</p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST"
              action="{{ url_for('login') }}">

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Create Account
            </a>
        </p>

    </div>

</div>

</body>
</html>
